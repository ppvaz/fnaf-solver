<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Twitch Plays FNaF</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <h1>Twitch Plays FNaF</h1>
      <div class="session"><span id="connection">Connecting</span><span id="active-count">0 / 4</span></div>
    </header>
    <main class="workspace">
      <section class="games" id="games" aria-label="Four game views"></section>
      <aside class="console">
        <form id="command-form">
          <label for="command">Chat</label>
          <input id="command" name="command" value="FNAF2 wind 1s" autocomplete="off" spellcheck="false" maxlength="160">
          <button class="send" type="submit">Send</button>
        </form>
        <p id="feedback" role="status" aria-live="polite">Awaiting runtime.</p>
        <details>
          <summary>Controls &amp; history</summary>
          <div class="quick-controls"><span id="quick-label">FNAF2</span><div id="quick-actions"></div></div>
          <div class="global-controls"><button id="pause-all">Pause all</button><button id="resume-all">Resume all</button></div>
          <div class="ledger-heading"><span>History</span><span id="event-count">0</span></div>
          <ol class="ledger" id="ledger"><li>No commands yet.</li></ol>
        </details>
      </aside>
    </main>
    <footer>Local prototype · Twitch chat is not connected.</footer>
  </div>
</body>
</html>
