name: CI

# Runs exactly the checks CLAUDE.md defines. The `--browser` suite is
# deliberately absent: it drives a trainer graded in real-time milliseconds,
# and a shared CI runner is exactly the load that degrades it — a fail there
# would say nothing about the code. Deployment is its own workflow
# (pages.yml): since 2026-09-30 the trainer is published as build.py's bundle,
# its modules' types stripped, instead of master's tree as committed.

on:
  push:
    branches: [master, refactor]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a committed FNaF 1 route winner pins its route at a
          # past commit, and test-fnaf1-winner.mjs materializes that commit.
          fetch-depth: 0
      # The sources are TypeScript run by Node's type stripping, on by default
      # from 22.18 (Pedro, 2026-09-30: "runtime .ts"); pinned to the version
      # this was built and measured on, as pages.yml is.
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      # Pin boundary toolchains before any contract lane can invoke them. The
      # Companion tests compile Java and the fixture classifiers use Pillow;
      # neither may depend on whatever happens to be preinstalled on the image.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fixture rendering and video dependencies
        run: |
          python3 -m pip install --disable-pip-version-check 'pillow==12.3.0' 'numpy==2.2.4' 'scipy==1.15.3'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the pinned workspace toolchain
        run: npm ci
      - name: Type and architecture contracts
        run: npm run typecheck && npm run test:unit && npm run test:contracts
      - name: Slow census gates
        run: npm run test:unit:slow
      - name: Clean-checkout model lane
        run: npm run test:core
      - name: Trainer build
        run: npm run build:trainer
      # The chain night-run.sh drives, minus the phone: a committed winner
      # compiled into a bundle, then the campaign CLI's own dry run over it.
      - name: Campaign dry-run over a committed winner
        run: d=$(mktemp -d) && trap 'rm -rf "$d"' EXIT && npm run --silent device:emit -- --winner packages/propose/bindings/fnaf2/campaign-night7-k3-winner.json --out "$d/k3" && npm run --silent device:campaign -- --bundle "$d/k3" --nights 7 --profile hid-mediaprojection
      - name: Documentation and catalog links
        run: npm run catalog && npm run chronicle && git diff --exit-code -- docs/architecture/generated docs/portal && node tools/test-docs.mjs
      # The repository has sourced mksh fragments as well as executable bash
      # scripts. ShellCheck's critical tier catches unknown shell context and
      # parse/expansion errors without pretending the existing warning backlog
      # is already resolved. The image tag is the toolchain pin.
      - name: ShellCheck critical diagnostics
        run: |
          docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck-alpine:v0.10.0 \
            sh -c 'find /mnt -type f -name "*.sh" -not -path "/mnt/.git/*" \
              -not -path "/mnt/captures/*" -not -path "/mnt/dist/*" \
              -not -path "/mnt/android/companion/build/*" -print0 |
              xargs -0 shellcheck -S error'
      - name: Shell footgun regressions
        run: packages/play/bin/phone/test-shell-footguns.sh
      # The full historical campaign remains an explicit local/release lane;
      # its deliberately red negative experiments are not a green edit gate.
      - name: Companion query (mock ADB)
        run: packages/play/bin/companion/test-query-companion.sh
      - name: Companion soak (mock ADB)
        run: packages/play/bin/companion/test-soak-companion.sh
